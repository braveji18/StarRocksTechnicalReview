# docs/02 §3.1 - 값 변경 시 반드시 결과표에 기록하고 전 항목 재측정
coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

query.max-memory=4GB
query.max-memory-per-node=1GB
query.max-total-memory=5GB

# 동시성 제어 (docs/06 §6.2 멀티테넌시 시나리오에서 조정)
query.max-concurrent-queries=100
query.max-queued-queries=1000

# Prometheus /metrics 엔드포인트
web-ui.enabled=true

# 내결함성 실행: 기본 비활성 (docs/06 §5.1 에서 활성/비활성 각각 측정)
# retry-policy=TASK
