# Track A 공통 레이크 - StarRocks 의 external catalog 와 동일한 테이블을 가리킨다
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lake/warehouse

# 대안: Hive Metastore 를 카탈로그로 쓰는 경우 위 3줄을 지우고 아래를 사용한다.
# (docs/02 §3 - 두 엔진이 같은 카탈로그를 보게 하는 것이 핵심이며, HMS/REST 어느 쪽이든 무방)
#iceberg.catalog.type=hive_metastore
#hive.metastore.uri=thrift://hive-metastore:9083
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Trino 458+ 에서 fs.native-s3.enabled 는 fs.s3.enabled 로 대체되었다.
# 구 버전을 고정한 경우 아래 주석을 반대로 적용할 것.
fs.s3.enabled=true
#fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
