# docs/02 §6 - 두 엔진의 수집 주기를 동일하게 유지할 것 (5s)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: trino
    metrics_path: /metrics
    static_configs:
      - targets: ['trino-coordinator:8080']
        labels: {engine: trino, role: coordinator}
      - targets: ['trino-worker-1:8080', 'trino-worker-2:8080']
        labels: {engine: trino, role: worker}

  - job_name: starrocks-fe
    metrics_path: /metrics
    static_configs:
      - targets: ['starrocks-fe:8030']
        labels: {engine: starrocks, role: fe}

  - job_name: starrocks-be
    metrics_path: /metrics
    static_configs:
      - targets: ['starrocks-be-1:8040', 'starrocks-be-2:8040']
        labels: {engine: starrocks, role: be}
